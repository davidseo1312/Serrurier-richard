<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="Coffre-fort dont le mécanisme est ouvert par un technicien serrurier">
  <defs>
    <linearGradient id="fc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123c68"/><stop offset="1" stop-color="#071d33"/></linearGradient>
    <linearGradient id="oc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc766"/><stop offset="1" stop-color="#c97f0c"/></linearGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b5f80"/><stop offset="1" stop-color="#16334e"/></linearGradient>
  </defs>
  <rect width="1120" height="620" fill="url(#fc)"/>
  <ellipse cx="540" cy="320" rx="430" ry="280" fill="#2a6ba8" opacity="0.14"/>

  <!-- Corps du coffre -->
  <rect x="300" y="120" width="440" height="380" rx="14" fill="url(#acier)"/>
  <rect x="322" y="142" width="396" height="336" rx="8" fill="#0f2c47"/>

  <!-- Porte entrouverte -->
  <g transform="translate(330 150)">
    <rect width="330" height="320" rx="8" fill="#1d4f7f"/>
    <rect x="16" y="16" width="298" height="288" rx="5" fill="none" stroke="#2f6ea8" stroke-width="4" opacity="0.6"/>
    <!-- Cadran à combinaison -->
    <circle cx="118" cy="160" r="62" fill="#0a2743"/>
    <circle cx="118" cy="160" r="48" fill="none" stroke="url(#oc)" stroke-width="7"/>
    <g stroke="#8fb6d8" stroke-width="4" stroke-linecap="round">
      <path d="M118 108v14M118 198v14M66 160h14M156 160h14"/>
    </g>
    <circle cx="118" cy="160" r="12" fill="url(#oc)"/>
    <path d="M118 160 l34 -26" stroke="#f7fafd" stroke-width="7" stroke-linecap="round"/>
    <!-- Poignée -->
    <rect x="230" y="128" width="20" height="86" rx="10" fill="url(#oc)"/>
    <circle cx="240" cy="171" r="20" fill="none" stroke="url(#oc)" stroke-width="9"/>
  </g>

  <!-- Pênes latéraux sortis -->
  <g fill="url(#oc)">
    <rect x="660" y="200" width="46" height="22" rx="8"/>
    <rect x="660" y="290" width="46" height="22" rx="8"/>
    <rect x="660" y="380" width="46" height="22" rx="8"/>
  </g>

  <!-- Stéthoscope d'auscultation -->
  <g transform="translate(790 250)" fill="none" stroke="#f7fafd" stroke-width="8" stroke-linecap="round">
    <path d="M0 0 q40 60 4 108"/>
    <circle cx="4" cy="126" r="20" fill="#0a2743" stroke="url(#oc)"/>
  </g>

  <rect x="270" y="500" width="500" height="16" rx="3" fill="#061826"/>
</svg>
