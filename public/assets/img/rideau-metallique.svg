<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="Rideau métallique de commerce bloqué, intervention de déblocage par un serrurier">
  <defs>
    <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123c68"/><stop offset="1" stop-color="#071d33"/></linearGradient>
    <linearGradient id="orr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc766"/><stop offset="1" stop-color="#c97f0c"/></linearGradient>
    <linearGradient id="lame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a6d8c"/><stop offset="0.5" stop-color="#7e9cb8"/><stop offset="1" stop-color="#3c5c78"/></linearGradient>
  </defs>
  <rect width="1120" height="620" fill="url(#fr)"/>
  <ellipse cx="560" cy="320" rx="450" ry="290" fill="#2a6ba8" opacity="0.14"/>

  <!-- Devanture -->
  <rect x="180" y="70" width="760" height="40" rx="5" fill="#0a2743"/>
  <rect x="196" y="110" width="728" height="12" fill="#123c68"/>

  <!-- Coulisses latérales -->
  <rect x="196" y="110" width="26" height="430" fill="#0a2743"/>
  <rect x="898" y="110" width="26" height="430" fill="#0a2743"/>

  <!-- Lames du rideau, descendu aux deux tiers -->
  <g>
    <rect x="222" y="122" width="676" height="286" fill="url(#lame)"/>
    <g stroke="#26415a" stroke-width="3">
      <path d="M222 148h676M222 174h676M222 200h676M222 226h676M222 252h676M222 278h676M222 304h676M222 330h676M222 356h676M222 382h676"/>
    </g>
    <rect x="222" y="392" width="676" height="20" rx="4" fill="#2b4a66"/>
  </g>

  <!-- Serrure centrale forcée -->
  <g transform="translate(560 400)">
    <circle r="20" fill="#0a2743"/>
    <circle r="8" fill="url(#orr)"/>
    <path d="M-34 -6 l-16 -14M34 -6 l16 -14" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Technicien : caisse à outils et manivelle de secours -->
  <g transform="translate(700 452)">
    <rect width="150" height="86" rx="9" fill="#0d2b47"/>
    <rect y="-14" width="150" height="20" rx="8" fill="url(#orr)"/>
    <rect x="60" y="-34" width="30" height="24" rx="6" fill="none" stroke="#f5a524" stroke-width="6"/>
    <g fill="#7e9cb8"><rect x="18" y="26" width="46" height="10" rx="5"/><rect x="18" y="50" width="78" height="10" rx="5"/></g>
  </g>
  <path d="M280 540 v-70 h40" fill="none" stroke="url(#orr)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="150" y="540" width="820" height="16" rx="3" fill="#061826"/>
</svg>
