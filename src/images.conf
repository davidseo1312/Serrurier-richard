# ---------------------------------------------------------------------------
# Catalogue des images du site.
#
# Chaque ligne décrit UN emplacement visuel de la page, et donne DEUX
# candidats pour le remplir :
#
#   1. une PHOTOGRAPHIE RÉELLE de Serrurier Richard, si le fichier existe ;
#   2. sinon, une ILLUSTRATION vectorielle de repli, toujours présente.
#
# Le build choisit tout seul, à chaque construction. Déposer une photo suffit
# donc à la faire apparaître partout où l'emplacement est utilisé — page
# d'accueil, pages services, galerie, aperçu social, sitemap images — sans
# toucher à une seule ligne de HTML.
#
# Format, séparé par des « | » :
#
#   ID | photo | repli | largeur | hauteur | alt de la photo | alt du repli
#
#   ID       identifiant utilisé dans les pages : {{IMG_ID}} pour la balise
#            complète, {{IMGSRC_ID}} pour l'URL seule.
#   photo    chemin de la photographie réelle, sans extension, relatif à
#            static/assets/images/. Laisser vide s'il n'y en a pas encore.
#   repli    chemin de l'illustration de secours, sans extension. Obligatoire.
#   alt      texte alternatif. IL Y EN A DEUX, et c'est volontaire : une
#            photographie et une illustration ne montrent pas la même chose,
#            et le texte alternatif doit décrire ce qui est réellement affiché.
#
# L'extension est absente des chemins : le build retient le meilleur fichier
# disponible, dans cet ordre —  .avif > .webp > .jpg > .jpeg > .png > .svg
#
# FORMATS DE STOCKAGE — le héros est en 16:9, tout le reste en 3:2. Les
# cartes et la galerie affichent le 3:2 tel quel ; les blocs d'intervention le
# recadrent en 4:3 par « object-fit: cover », sans jamais déformer. Un seul
# fichier maître par emplacement suffit donc à couvrir tous les usages.
#
# VARIANTES RESPONSIVES — déposer en plus des fichiers suffixés -600, -800,
# -1000, -1200 ou -1600 suffit à construire l'attribut srcset.
# scripts/preparer-photos.py produit 600, 1000 et 1200 automatiquement.
# Aucun code à modifier.
#
# HONNÊTETÉ — le site indique de lui-même si un visuel est une photographie ou
# une illustration : le jeton {{MENTION_VISUELS}} bascule automatiquement selon
# ce que le build a réellement trouvé. Ne présentez jamais une illustration
# comme un chantier réel, et ne déposez comme photo que des clichés pris par
# l'entreprise, avec l'accord des clients concernés.
#
# Voir docs/photos.md pour la marche à suivre complète.
# ---------------------------------------------------------------------------

