# ---------------------------------------------------------------------------
# Catalogue des images du site.
#
# Format, séparé par des « | » :
#   IDENTIFIANT | chemin sans extension | largeur | hauteur | texte alternatif
#
# Le chemin est relatif à /assets/images/. L'extension est volontairement
# absente : c'est le build qui choisit le meilleur fichier disponible, dans
# cet ordre de préférence :
#
#       .avif  >  .webp  >  .jpg  >  .jpeg  >  .png  >  .svg
#
# CONSÉQUENCE PRATIQUE — ajouter une vraie photo ne demande AUCUN code :
#   1. préparez la photo aux dimensions indiquées ci-dessous ;
#   2. déposez-la dans static/assets/images/<dossier>/ sous le nom exact
#      indiqué, avec l'extension .webp (ou .jpg) ;
#   3. relancez « bash scripts/build.sh ».
#   L'illustration vectorielle est alors remplacée partout où l'image
#   apparaît, y compris dans l'aperçu social et le sitemap images.
#
# VARIANTES RESPONSIVES — si vous déposez en plus des fichiers suffixés
#   -800, -1200 ou -1600 (ex. serrurier-au-travail-800.webp), le build
#   construit automatiquement l'attribut srcset correspondant.
#
# TEXTE ALTERNATIF — il décrit ce que montre réellement l'image, pour les
#   lecteurs d'écran et pour Google Images. Il doit être mis à jour en même
#   temps que l'image. Pas de bourrage de mots-clés.
#
# Les visuels livrés aujourd'hui sont des ILLUSTRATIONS, pas des photographies
# d'intervention. Ne les présentez jamais comme des chantiers réels.
# ---------------------------------------------------------------------------

