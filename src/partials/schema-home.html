<!-- L'identité (WebSite, Locksmith, WebPage) est portée par schema-entite.html
     sur toutes les pages. Ce bloc n'ajoute que le catalogue de prestations,
     rattaché à l'entreprise par son @id : deux nœuds de même @id fusionnent,
     c'est le mécanisme normal de JSON-LD. Les montants sont des minPrice —
     des prix de départ, jamais un plafond. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@id": "{{BASE_URL}}/#entreprise",
  "@type": "Locksmith",
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Prestations de serrurerie",
    "itemListElement": [
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ouverture de porte claquée", "url": "{{BASE_URL}}/ouverture-porte" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": "{{FORFAIT_OUVERTURE_SIMPLE}}", "priceCurrency": "EUR", "valueAddedTaxIncluded": true } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Changement de cylindre", "url": "{{BASE_URL}}/changement-serrure" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": "{{FORFAIT_CHANGEMENT_CYLINDRE}}", "priceCurrency": "EUR", "valueAddedTaxIncluded": true } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ouverture de porte blindée", "url": "{{BASE_URL}}/porte-blindee" }, "priceSpecification": { "@type": "PriceSpecification", "minPrice": "{{FORFAIT_OUVERTURE_BLINDEE}}", "priceCurrency": "EUR", "valueAddedTaxIncluded": true } }
    ]
  }
}
</script>
