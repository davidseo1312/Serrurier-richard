<!doctype html>
<html lang="fr" data-ga="{{GA4_ID}}" data-gtm="{{GTM_ID}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESC}}">
<link rel="canonical" href="{{PAGE_URL}}">
<meta name="robots" content="{{ROBOTS_POLICY}}, follow, max-image-preview:large">
<meta name="theme-color" content="#0F172A">
<meta name="format-detection" content="telephone=yes">
{{BLOC_VERIFICATION}}

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="{{NOM_COMMERCIAL}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESC}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="{{BASE_URL}}{{PAGE_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{NOM_COMMERCIAL}} — {{BASELINE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESC}}">
<meta name="twitter:image" content="{{BASE_URL}}{{PAGE_IMAGE}}">

<!-- Icône d'onglet : la marque du logo, sur plaque blanche. Plus de SVG —
     le logo est une image matricielle, un SVG n'aurait fait qu'emballer le
     même PNG. Le .ico contient les définitions 16, 32 et 48. -->
<link rel="icon" href="/assets/img/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/img/icone-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<!-- Les deux graisses présentes dès le premier écran sont préchargées : sans
     cela le navigateur ne les découvre qu'après avoir analysé la feuille de
     style, et le texte permute visiblement. Les autres se chargent à la
     demande. crossorigin est requis même en même origine pour les polices. -->
<link rel="preload" href="/assets/fonts/outfit-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/worksans-400.woff2" as="font" type="font/woff2" crossorigin>
{{PRECHARGEMENT_HERO}}
<link rel="stylesheet" href="{{CSS_URL}}">
