<!-- ---------------------------------------------------------------------
     En-tête du site, en deux étages.

     La barre supérieure porte ce que l'entreprise fait et comment la
     joindre : elle est fine, discrète, et disparaît au défilement pour
     laisser toute la hauteur au header principal.

     Le header principal est un rail à trois colonnes — marque, navigation,
     action — dont la colonne centrale est réellement centrée, quelle que
     soit la largeur de la marque ou du bouton. C'est ce qui donne
     l'impression d'équilibre.
     --------------------------------------------------------------------- -->
<div class="barre-haute">
  <div class="wrap barre-haute-inner">
    <ul class="barre-haute-metier">
      <li>Intervention</li>
      <li>Dépannage</li>
      <li>Installation</li>
      <li>Sécurisation</li>
    </ul>
    <p class="barre-haute-contact">
      <a href="tel:{{TELEPHONE_E164}}" data-track="appel" data-track-zone="barre-haute">{{TELEPHONE}}</a>
      <span aria-hidden="true">·</span>
      <a href="/devis-serrurerie" data-track="clic_devis" data-track-zone="barre-haute">Demander un devis</a>
    </p>
  </div>
</div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="{{NOM_COMMERCIAL}} — retour à l'accueil">
      <span class="brand-text">
        <strong>{{NOM_COMMERCIAL}}</strong>
        <small>{{BASELINE}}</small>
      </span>
    </a>

    <nav id="nav-principal" class="nav" aria-label="Navigation principale">
      <ul>
        <li><a href="/">Accueil</a></li>
        <li><a href="/serrurier">Prestations</a></li>
        <li><a href="/serrurier-urgence">Urgence</a></li>
        <li><a href="/zones-d-intervention">Zones</a></li>
        <li><a href="/tarifs">Tarifs</a></li>
        <li><a href="/blog/">Conseils</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a class="btn btn-ghost header-devis" href="/devis-serrurerie" data-track="clic_devis" data-track-zone="entete">
        Devis gratuit
      </a>

      <a class="btn btn-call header-call" href="tel:{{TELEPHONE_E164}}" data-track="appel" data-track-zone="entete">
        <span class="header-call-libelle">Appeler</span>
        <strong class="header-call-numero">{{TELEPHONE}}</strong>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-principal">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Ouvrir le menu</span>
      </button>
    </div>
  </div>
</header>
