     La barre de service qui coiffait la page a été supprimée. Elle répétait
     le téléphone et le devis déjà présents ici, elle poussait le contenu vers
     le bas, et c'était le premier bloc que le visiteur voyait — donc le
     dernier endroit où se permettre du remplissage.

     Ce qu'elle portait d'utile est remonté : le téléphone et le devis sont
     dans la ligne principale, à droite. Les trois métiers sont devenus la
     baseline sous le nom, où ils ne coûtent aucune hauteur.

     Rail à trois colonnes — NOM | NAVIGATION | ACTIONS — dont la colonne
     centrale est réellement centrée. La page courante est marquée par le
     build (aria-current="page").
     --------------------------------------------------------------------- -->
