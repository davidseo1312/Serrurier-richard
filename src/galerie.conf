# ---------------------------------------------------------------------------
# Galerie « Nos interventions ».
#
# Une ligne = une vignette. L'ordre du fichier est l'ordre d'affichage.
# Ajouter une intervention à la galerie ne demande donc aucun code : on ajoute
# une ligne ici, et on relance « bash scripts/build.sh ».
#
# Format, séparé par des « | » :
#   ID D'IMAGE | FAMILLE | TITRE | LÉGENDE
#
#   ID       identifiant présent dans src/images.conf.
#   FAMILLE  sert au filtre affiché au-dessus de la galerie. Écrivez le
#            libellé tel qu'il doit apparaître ; les familles sont déduites
#            de ce fichier, dans l'ordre de première apparition.
#   LÉGENDE  décrit le geste, sans promesse chiffrée ni délai inventé.
# ---------------------------------------------------------------------------

OUVERTURE_PORTE|Dépannage|Ouverture de porte|Une porte claquée s'ouvre sans trace et sans remplacer la serrure.
URGENCE_NUIT|Dépannage|Dépannage de nuit|Le dépannage ne s'arrête pas le soir : l'éclairage change, la méthode non.
CLE_CASSEE|Dépannage|Clé cassée|Le fragment s'extrait à l'outil dédié ; le cylindre survit le plus souvent.
PORTE_BLOQUEE|Dépannage|Porte bloquée|Clé qui tourne dans le vide : le mécanisme est en cause, pas la clé.
CHANGEMENT_SERRURE|Serrures|Remplacement de serrure|Le cylindre seul suffit quand le coffre n'est pas en cause.
SERRURE_3_POINTS|Serrures|Serrure multipoints|Trois points de condamnation répartis sur la hauteur de la porte.
INSTALLATION|Serrures|Installation|Relevé des cotes avant pose : une serrure mal implantée force en permanence.
BLINDAGE|Sécurité|Blindage de porte|Plaque d'acier, cornière anti-pince et gâches renforcées.
PORTE_BLINDEE|Sécurité|Porte blindée|Serrure A2P et pênes latéraux sur un bloc-porte complet.
EFFRACTION|Sécurité|Après effraction|Mise en sécurité le jour même, constat écrit pour l'assurance.
RIDEAU_METALLIQUE|Professionnels|Rideau métallique|Déblocage avant l'ouverture du commerce, sur créneau convenu.
COFFRE_FORT|Professionnels|Coffre-fort|Ouverture par auscultation, puis remise en service du mécanisme.
INTERVENTION|Professionnels|Sur place|Diagnostic, devis signé, puis intervention. Jamais l'inverse.
