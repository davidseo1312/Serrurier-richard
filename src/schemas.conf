# ---------------------------------------------------------------------------
# Schémas explicatifs.
#
# Un schéma n'est PAS une photographie d'intervention. C'est une planche
# pédagogique — texte, repères, vues éclatées — dont le format et la mise en
# page sont porteurs de sens. La recadrer au format d'une carte couperait ses
# légendes : elle est donc affichée à ses proportions natives, en pleine
# largeur de colonne, et ne rejoint ni les cartes ni la galerie.
#
# ⚠ NE JAMAIS présenter un schéma comme un chantier réel de l'entreprise.
#   Une planche « avant / après » illustre ce qu'est une sécurisation ; elle
#   ne documente pas une intervention datée chez un client. La légende
#   affichée doit le dire, et elle le dit.
#
# Format, séparé par des « | » :
#   ID | chemin sans extension | largeur | hauteur | texte alternatif | légende
#
# Le jeton {{SCHEMA_ID}} pose la figure complète, légende comprise.
# ---------------------------------------------------------------------------

EFFRACTION|schemas/securisation-apres-effraction|1254|1254|Planche explicative « Sécurisation après effraction » : à gauche une porte au chant arraché autour de la serrure, à droite la même porte remise en sécurité avec serrure multipoints, cylindre haute sécurité et paumelles renforcées|Ce que comprend une sécurisation après effraction : remplacement de la serrure, pose d'un cylindre haute sécurité, renforcement de la porte et de ses paumelles. <strong>Cette planche est un schéma explicatif</strong>, pas la photographie d'un chantier particulier.

PORTE_BLINDEE|schemas/porte-blindee-multipoints|1254|1254|Planche explicative « Porte blindée multipoints » : vue d'ensemble d'un bloc-porte blindé, coupe montrant la tôle d'acier, l'âme isolante et la structure, et détails de la serrure multipoints, du cylindre haute sécurité, des paumelles, du cadre acier et du judas|Les organes d'un bloc-porte blindé, de la tôle d'acier au judas optique. <strong>Cette planche est un schéma explicatif</strong> : elle décrit un principe de construction, pas un modèle que nous vendrions ni une porte posée chez un client.
